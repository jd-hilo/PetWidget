name: Petmoji
options:
  bundleIdPrefix: com.petmoji
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  groupSortPosition: top
  generateEmptyDirectories: true

# Recreated when you run `xcodegen generate` (shared schemes are not merged by XcodeGen).
schemes:
  Petmoji:
    build:
      targets:
        Petmoji: all
  PetmojiWidget:
    build:
      targets:
        PetmojiWidget: all
        Petmoji: all
    run:
      askForAppToLaunch: true
      launchAutomaticallySubstyle: "2"
      executable: Petmoji
      environmentVariables:
        _XCWidgetKind: ""
        _XCWidgetDefaultView: timeline
        _XCWidgetFamily: systemMedium

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "6"
    DEVELOPMENT_TEAM: ""
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
  OneSignalSDK:
    url: https://github.com/OneSignal/OneSignal-XCFramework
    from: "5.2.0"
  PostHog:
    url: https://github.com/PostHog/posthog-ios.git
    from: "3.59.3"

targets:
  Petmoji:
    type: application
    platform: iOS
    sources:
      - path: Petmoji
    resources:
      - path: Petmoji/Resources
    info:
      path: Petmoji/Info.plist
      properties:
        CFBundleDisplayName: Petmoji
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleIconName: AppIcon
        UILaunchStoryboardName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Automatic
        NSPhotoLibraryUsageDescription: "To upload photos of your pet for sprite generation"
        NSCameraUsageDescription: "To take photos of your pet for sprite generation"
        NSLocationAlwaysAndWhenInUseUsageDescription: "So your pet can react when you leave and come back home"
        NSLocationWhenInUseUsageDescription: "So your pet can react when you leave and come back home, and so you can optionally prefill your home address"
        BGTaskSchedulerPermittedIdentifiers:
          - com.petmoji.been-gone-2h
          - com.petmoji.been-gone-6h
        NSUserActivityTypes:
          - INSendMessageIntent
        UIBackgroundModes:
          - location
          - remote-notification
          - fetch
          - processing
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        CFBundleURLTypes:
          - CFBundleURLName: com.petmoji.app
            CFBundleURLSchemes:
              - petmoji
        ONESIGNAL_APP_ID: $(ONESIGNAL_APP_ID)
        POSTHOG_API_KEY: $(POSTHOG_API_KEY)
        POSTHOG_HOST: $(POSTHOG_HOST)
        REVENUECAT_API_KEY: $(REVENUECAT_API_KEY)
        PETMOJI_TERMS_URL: $(PETMOJI_TERMS_URL)
        PETMOJI_PRIVACY_URL: $(PETMOJI_PRIVACY_URL)
    entitlements:
      path: Petmoji/Petmoji.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.petmoji.app
        com.apple.developer.usernotifications.communication: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.petmoji.app
        INFOPLIST_FILE: Petmoji/Info.plist
        ONESIGNAL_APP_ID: 50232d9c-b355-4208-86ba-d36d7da3dee7
        POSTHOG_API_KEY: ""
        POSTHOG_HOST: "https://us.i.posthog.com"
        PETMOJI_TERMS_URL: "https://pastoral-supply-662.notion.site/Terms-of-Service-for-Petmoji-39f2cec59ddf800d9effe270d79ad394"
        PETMOJI_PRIVACY_URL: "https://pastoral-supply-662.notion.site/Privacy-Policy-for-Petmoji-39f2cec59ddf80a8a5b8e2c7f5d6d379"
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Petmoji/Petmoji.entitlements
          PRODUCT_BUNDLE_IDENTIFIER: com.hilollcpetmoji.app
        Release:
          CODE_SIGN_ENTITLEMENTS: Petmoji/Petmoji-Release.entitlements
          PRODUCT_BUNDLE_IDENTIFIER: com.hilollc.petmoji.app
          ONESIGNAL_APP_ID: 50232d9c-b355-4208-86ba-d36d7da3dee7

    dependencies:
      - package: Supabase
        product: Supabase
      - package: OneSignalSDK
        product: OneSignalFramework
      - package: PostHog
        product: PostHog
      - target: PetmojiWidget
        embed: true
      - target: PetmojiNotificationService
        embed: true

  PetmojiWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: PetmojiWidget
    info:
      path: PetmojiWidget/Info.plist
      properties:
        CFBundleDisplayName: PetmojiWidget
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: PetmojiWidget/PetmojiWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.petmoji.app
    settings:
      base:
        INFOPLIST_FILE: PetmojiWidget/Info.plist
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.hilollcpetmoji.app.widget
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.hilollc.petmoji.app.widget

  PetmojiNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: PetmojiNotificationService
    info:
      path: PetmojiNotificationService/Info.plist
      properties:
        CFBundleDisplayName: PetmojiNotificationService
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: PetmojiNotificationService/PetmojiNotificationService.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.petmoji.app
    settings:
      base:
        INFOPLIST_FILE: PetmojiNotificationService/Info.plist
        PRODUCT_NAME: PetmojiNotificationService
        SKIP_INSTALL: true
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.hilollcpetmoji.app.NotificationService
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.hilollc.petmoji.app.NotificationService
